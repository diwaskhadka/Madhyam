name: Release

# Push a tag like `v0.1.0` (or use "Run workflow" with a tag name) to build
# every platform and publish a GitHub Release with the files attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish, e.g. v0.1.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test (x64 only; arm64 cannot run on this runner)
        if: matrix.arch == 'x64'
        run: cargo test --workspace --release
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $out = "madhyam-core-$env:TAG-windows-${{ matrix.arch }}"
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force "$out/include", "$out/bindings" | Out-Null
          Copy-Item "$bin/madhyam_core_ffi.dll", "$bin/madhyam_core_ffi.dll.lib", "$bin/madhyam_core_ffi.lib", "$bin/iptv.exe" $out
          Copy-Item include/madhyam_core.h "$out/include/"
          Copy-Item -Recurse bindings/csharp, bindings/python "$out/bindings/"
          Copy-Item README.md, LICENSE, docs/API.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: madhyam-core-*.zip

  windows-app:
    name: windows app (Madhyam.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo build --release -p madhyam-core-ffi
      - name: Publish (self-contained, no .NET install needed)
        shell: pwsh
        # Errors are re-emitted as annotations so they are visible via the API, not only in raw logs.
        run: |
          dotnet publish windows/Madhyam.Windows/Madhyam.Windows.csproj -c Release -r win-x64 --self-contained true -o publish/Madhyam 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error NU|error MSB|error CS' | Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Smoke test - starts without errors
        shell: pwsh
        run: |
          $top = Get-ChildItem publish/Madhyam | ForEach-Object { if ($_.PSIsContainer) { "$($_.Name)/" } else { $_.Name } }
          Write-Host "::notice::Publish folder: $($top -join ', ')"
          Write-Host "::notice::libvlc/win-x64 present: $(Test-Path publish/Madhyam/libvlc/win-x64/libvlc.dll)"
          $log = Join-Path $env:LOCALAPPDATA "Madhyam\error.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process publish/Madhyam/Madhyam.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log | Select-Object -First 30 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          if (-not $alive) { Write-Host "::error::Madhyam exited during startup (code $($p.ExitCode))"; exit 1 }
          Write-Host "Madhyam.exe started and stayed up for 20 s"
      - name: Check layout and zip
        shell: pwsh
        run: |
          Copy-Item windows/README-FIRST.txt publish/Madhyam/
          if (-not (Test-Path publish/Madhyam/Madhyam.exe)) { Write-Host "::error::Madhyam.exe missing from publish output"; exit 1 }
          $top = Get-ChildItem publish/Madhyam | Select-Object -ExpandProperty Name
          Write-Host "::notice::Top-level files: $($top -join ', ')"
          if ($top.Count -gt 12) { Write-Host "::error::Too many top-level files ($($top.Count)); single-file publish did not apply"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem publish/Madhyam -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "::notice::Unpacked size: $mb MB"
          Compress-Archive -Path publish/Madhyam -DestinationPath Madhyam-${{ env.TAG }}-windows-x64.zip
      - name: Build the Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = "$env:TAG".TrimStart('v')
          & $iscc /Q "/DAppVersion=$v" "/DSourceDir=$PWD\publish\Madhyam" "/DOutputDir=$PWD\setup" windows/installer/Madhyam.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          $exe = Get-ChildItem setup/*.exe | Select-Object -First 1
          Write-Host "::notice::Installer: $($exe.Name), $([math]::Round($exe.Length / 1MB, 1)) MB"
      - name: Installer test - install, start, uninstall
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 30 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Madhyam\Madhyam.exe"
          if (-not (Test-Path $app)) { Write-Host "::error::Madhyam.exe not installed at $app"; exit 1 }
          if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Madhyam.lnk"))) { Write-Host "::error::Start menu shortcut missing"; exit 1 }
          $r = Start-Process $app -PassThru; Start-Sleep -Seconds 15
          if ($r.HasExited) { Write-Host "::error::installed Madhyam exited during startup"; exit 1 }
          Stop-Process -Id $r.Id -Force; Start-Sleep -Seconds 2
          $un = Get-ChildItem (Split-Path $app) -Filter "unins*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Write-Host "::error::uninstall left Madhyam.exe behind"; exit 1 }
          Write-Host "::notice::Installer installs, starts and uninstalls cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: Madhyam-${{ env.TAG }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: setup/Madhyam-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 21 -o android/app/src/main/jniLibs build --release -p madhyam-core-ffi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Package
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Madhyam-$TAG-androidtv.apk"
          (cd android/app/src/main && zip -qr "$GITHUB_WORKSPACE/madhyam-core-$TAG-android-jniLibs.zip" jniLibs)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Madhyam-*.apk
            madhyam-core-*-android-jniLibs.zip

  publish:
    needs: [windows, windows-app, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Split public / developer files
        run: |
          mkdir -p public dev
          mv dist/Madhyam-Setup-*.exe public/
          mv dist/* dev/
          ls -la public dev
      # Public release: the Windows installer only.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Madhyam ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: public/*
          body: |
            **Windows 10 / 11 (64-bit):** download `Madhyam-Setup-*.exe` and run it.
            It installs for your user account (no admin needed), adds a Start menu shortcut, and
            can be removed from Settings > Apps. Installing a newer version upgrades in place and
            keeps your playlists and settings.

            "Windows protected your PC"? Madhyam is not code-signed yet: click **More info** > **Run anyway**.
      # Developer files (portable zip, engine DLLs, Android): a draft release only the repo owner can see.
      - name: Developer files (private draft)
        run: |
          DEV="dev-$TAG"
          gh release view "$DEV" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DEV" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Developer files $TAG (private draft)" \
              --notes "Not public. Portable zip, madhyam-core engine (DLL, headers, bindings, iptv.exe), Android TV APK and jniLibs for $TAG."
          gh release upload "$DEV" -R "$GITHUB_REPOSITORY" dev/* --clobber
