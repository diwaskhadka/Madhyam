name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# One run per branch/PR: a newer push cancels the older run automatically,
# and pushing a PR branch no longer runs CI twice (push + pull_request).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C ABI end-to-end test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) LIB=target/release/madhyam_core_ffi.dll ;;
            macOS)   LIB=target/release/libmadhyam_core_ffi.dylib ;;
            *)       LIB=target/release/libmadhyam_core_ffi.so ;;
          esac
          python bindings/python/e2e_test.py "$LIB"
      - name: Benchmark (informational)
        run: cargo run --release -p madhyam-core-cli -- bench 50000 30
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: madhyam-core-windows-x64
          path: |
            target/release/madhyam_core_ffi.dll
            target/release/madhyam_core_ffi.dll.lib
            target/release/iptv.exe
            include/madhyam_core.h

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release -p madhyam-core-ffi --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: madhyam-core-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/madhyam_core_ffi.dll

  windows-app:
    name: windows app (Madhyam.exe)
    runs-on: windows-latest
    permissions:
      contents: write # upload UI screenshots to the "ci-screenshots" draft release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cargo build --release -p madhyam-core-ffi
      - name: Publish (self-contained, no .NET install needed)
        shell: pwsh
        # Errors are re-emitted as annotations so they are visible via the API, not only in raw logs.
        run: |
          dotnet publish windows/Madhyam.Windows/Madhyam.Windows.csproj -c Release -r win-x64 --self-contained true -o publish/Madhyam 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error NU|error MSB|error CS' | Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Smoke test - starts without errors
        shell: pwsh
        run: |
          $top = Get-ChildItem publish/Madhyam | ForEach-Object { if ($_.PSIsContainer) { "$($_.Name)/" } else { $_.Name } }
          Write-Host "::notice::Publish folder: $($top -join ', ')"
          Write-Host "::notice::libvlc/win-x64 present: $(Test-Path publish/Madhyam/libvlc/win-x64/libvlc.dll)"
          $log = Join-Path $env:LOCALAPPDATA "Madhyam\error.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process publish/Madhyam/Madhyam.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log | Select-Object -First 30 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          if (-not $alive) { Write-Host "::error::Madhyam exited during startup (code $($p.ExitCode))"; exit 1 }
          Write-Host "Madhyam.exe started and stayed up for 20 s"
      - name: UI screenshots (demo data, rendered off-screen)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $data = Join-Path $env:LOCALAPPDATA "Madhyam"
          python windows/ci/make_demo_snapshot.py target/release/madhyam_core_ffi.dll $data
          New-Item -ItemType Directory -Force shots | Out-Null
          $cases = [ordered]@{
            "01-dashboard"      = @("--mode", "Dashboard")
            "02-live"           = @("--mode", "Live")
            "03-movies"         = @("--mode", "Movies")
            "04-movie-details"  = @("--mode", "Movies", "--open-first")
            "05-series-details" = @("--mode", "Series", "--open-first")
            "06-favorites"      = @("--mode", "Favorites")
            "07-recent"         = @("--mode", "Recent")
            "08-added"          = @("--mode", "Added")
            "09-search"         = @("--mode", "Search", "--search", "the")
            "10-live-search"    = @("--mode", "Live", "--search", "news")
            "11-settings-src"   = @("--mode", "Live", "--settings", "Sources")
            "12-settings-dash"  = @("--mode", "Live", "--settings", "Dashboard")
            "13-light-dash"     = @("--mode", "Dashboard", "--light")
            "14-light-details"  = @("--mode", "Series", "--open-first", "--light")
            "15-movie-playing"  = @("--mode", "Movies", "--open-first", "--play-first")
            "16-episode-playing" = @("--mode", "Series", "--open-first", "--play-first")
            "17-custom-dark"    = @("--mode", "Dashboard")
            "18-custom-light"   = @("--mode", "Live")
          }
          # Custom themes (Settings › Visual theme › Custom), each built from one picked colour.
          $themes = @{
            "17-custom-dark"  = '{ "Theme": "Custom", "CustomColor": "#12A4A4" }'
            "18-custom-light" = '{ "Theme": "Custom", "CustomColor": "#6C4AD8", "CustomLight": true }'
          }
          foreach ($name in $cases.Keys) {
            $out = Join-Path (Resolve-Path shots) "$name.png"
            $settingsFile = Join-Path $data "settings.json"
            if ($themes.Contains($name)) { $themes[$name] | Set-Content $settingsFile }
            elseif ($cases[$name] -contains "--light") { '{ "Theme": "Light" }' | Set-Content $settingsFile } else { Remove-Item $settingsFile -ErrorAction SilentlyContinue }
            $p = Start-Process publish/Madhyam/Madhyam.exe -ArgumentList ($cases[$name] + @("--screenshot", "`"$out`"")) -PassThru
            if (-not $p.WaitForExit(45000)) { Stop-Process -Id $p.Id -Force; Write-Host "::warning::$name timed out" }
            if (Test-Path $out) { Write-Host "::notice::screenshot $name ok" } else { Write-Host "::warning::screenshot $name missing" }
          }
          $err = Join-Path $data "error.log"
          if (Test-Path $err) { Get-Content $err | Select-Object -First 20 | ForEach-Object { Write-Host "::warning::$_" } }
          gh release view ci-screenshots 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screenshots --draft --title "CI screenshots (not a release)" --notes "UI screenshots rendered by CI with demo data." }
          gh release upload ci-screenshots (Get-ChildItem shots/*.png).FullName --clobber
      - name: Check layout and zip
        shell: pwsh
        run: |
          Copy-Item windows/README-FIRST.txt publish/Madhyam/
          if (-not (Test-Path publish/Madhyam/Madhyam.exe)) { Write-Host "::error::Madhyam.exe missing from publish output"; exit 1 }
          $top = Get-ChildItem publish/Madhyam | Select-Object -ExpandProperty Name
          Write-Host "::notice::Top-level files: $($top -join ', ')"
          if ($top.Count -gt 12) { Write-Host "::error::Too many top-level files ($($top.Count)); single-file publish did not apply"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem publish/Madhyam -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "::notice::Unpacked size: $mb MB"
          Compress-Archive -Path publish/Madhyam -DestinationPath Madhyam-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Madhyam-windows-x64
          path: Madhyam-windows-x64.zip
      - name: Build the Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = "0.0.${{ github.run_number }}".TrimStart('v')
          & $iscc /Q "/DAppVersion=$v" "/DSourceDir=$PWD\publish\Madhyam" "/DOutputDir=$PWD\setup" windows/installer/Madhyam.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          $exe = Get-ChildItem setup/*.exe | Select-Object -First 1
          Write-Host "::notice::Installer: $($exe.Name), $([math]::Round($exe.Length / 1MB, 1)) MB"
      - name: Installer test - install, start, uninstall
        shell: pwsh
        run: |
          $exe = (Get-ChildItem setup/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 30 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Madhyam\Madhyam.exe"
          if (-not (Test-Path $app)) { Write-Host "::error::Madhyam.exe not installed at $app"; exit 1 }
          if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Madhyam.lnk"))) { Write-Host "::error::Start menu shortcut missing"; exit 1 }
          $r = Start-Process $app -PassThru; Start-Sleep -Seconds 15
          if ($r.HasExited) { Write-Host "::error::installed Madhyam exited during startup"; exit 1 }
          Stop-Process -Id $r.Id -Force; Start-Sleep -Seconds 2
          $un = Get-ChildItem (Split-Path $app) -Filter "unins*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Write-Host "::error::uninstall left Madhyam.exe behind"; exit 1 }
          Write-Host "::notice::Installer installs, starts and uninstalls cleanly"

  linux-app:
    name: linux app (GTK 4 + mpv, .deb + AppImage)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libmpv-dev dpkg-dev librsvg2-bin \
            xvfb xauth imagemagick libgl1-mesa-dri dbus-x11 file fuse3 > /dev/null
      - name: Format and lint (warnings are errors)
        working-directory: linux
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build (engine .so for the test helpers, and the app)
        run: |
          cargo build --release -p madhyam-core-ffi
          (cd linux && cargo build --release)
          target/release/madhyam --version
      - name: Smoke test - starts without errors
        # A fresh data folder: first start preinstalls Free TV (downloads the iptv-org list).
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/smoke"
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- timeout 25 target/release/madhyam || code=$?
          log="$XDG_DATA_HOME/Madhyam/error.log"
          if [ -f "$log" ]; then head -30 "$log" | sed 's/^/::error::/'; exit 1; fi
          if [ "${code:-0}" != 124 ]; then echo "::error::madhyam exited during startup (code ${code:-0})"; exit 1; fi
          echo "::notice::madhyam started and stayed up for 25 s; $(grep -c . "$XDG_DATA_HOME/Madhyam/app.log" 2>/dev/null || echo 0) log lines"
          sed 's/^/  /' "$XDG_DATA_HOME/Madhyam/app.log" 2>/dev/null | tail -15 || true
      - name: Playback test - mpv draws video into the window
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/play"
          python3 linux/ci/make_test_playlist.py target/release/libmadhyam_core_ffi.so "$XDG_DATA_HOME/Madhyam"
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 target/release/madhyam --mode Live --play-first --screenshot "$PWD/shots/linux-20-live-playing.png"
          log="$XDG_DATA_HOME/Madhyam/app.log"; cat "$log"
          grep -q "first video frame" "$log" || { echo "::error::no video frame was drawn"; exit 1; }
          grep -qE "time-pos=Some\([1-9]" "$log" || { echo "::error::playback did not advance"; exit 1; }
          # The picture area must not be black (mean brightness of the middle of the video).
          m=$(convert shots/linux-20-live-playing.png -crop 500x250+800+200 -format "%[fx:mean]" info:)
          echo "::notice::video area brightness $m"
          awk "BEGIN { exit !($m > 0.15) }" || { echo "::error::the video area is black"; exit 1; }
      - name: UI screenshots (demo data)
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/demo"
          data="$XDG_DATA_HOME/Madhyam"
          python3 windows/ci/make_demo_snapshot.py target/release/libmadhyam_core_ffi.so "$data"
          shot() {
            name=$1; theme=$2; shift 2
            if [ -n "$theme" ]; then echo "$theme" > "$data/settings.json"; else rm -f "$data/settings.json"; fi
            xvfb-run -a -s "-screen 0 1600x1000x24" timeout 60 target/release/madhyam "$@" --screenshot "$PWD/shots/linux-$name.png" \
              && echo "::notice::screenshot $name ok" || echo "::warning::screenshot $name failed"
          }
          shot 01-dashboard "" --mode Dashboard
          shot 02-live "" --mode Live
          shot 03-movies "" --mode Movies
          shot 04-movie-details "" --mode Movies --open-first
          shot 05-series-details "" --mode Series --open-first
          shot 06-favorites "" --mode Favorites
          shot 07-recent "" --mode Recent
          shot 09-search "" --mode Search --search the
          shot 11-settings-src "" --mode Live --settings Sources
          shot 13-light-dash '{ "Theme": "Light" }' --mode Dashboard
          shot 17-custom-dark '{ "Theme": "Custom", "CustomColor": "#12A4A4" }' --mode Dashboard
          shot 18-custom-light '{ "Theme": "Custom", "CustomColor": "#6C4AD8", "CustomLight": true }' --mode Live
          if [ -f "$data/error.log" ]; then head -20 "$data/error.log" | sed 's/^/::warning::/'; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: shots/*.png
      - name: Package (.deb and AppImage)
        run: |
          mkdir -p tools
          curl -fsSL -o tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o tools/linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x tools/*
          export PATH="$PWD/tools:$PATH"
          LINUXDEPLOY="$PWD/tools/linuxdeploy-x86_64.AppImage" bash linux/packaging/package.sh target/release/madhyam dist \
            "$(tr -d '[:space:]' < VERSION)+ci${{ github.run_number }}"
          ls -la dist
      - name: Install test - .deb installs, starts and removes
        run: |
          sudo apt-get install -y -qq ./dist/*.deb > /dev/null
          test -x /usr/bin/madhyam && test -f /usr/share/applications/dev.madhyam.Madhyam.desktop
          madhyam --version
          export XDG_DATA_HOME="$RUNNER_TEMP/installed"
          xvfb-run -a timeout 15 madhyam --mode Dashboard --screenshot "$PWD/installed.png"
          test -s installed.png || { echo "::error::installed app did not render"; exit 1; }
          sudo apt-get remove -y -qq madhyam > /dev/null
          test ! -e /usr/bin/madhyam
          echo "::notice::.deb installs, renders and uninstalls cleanly"
      - name: AppImage test - runs on its own
        run: |
          app=$(ls dist/*.AppImage)
          file "$app"
          "$app" --appimage-extract-and-run --version
          export XDG_DATA_HOME="$RUNNER_TEMP/appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 30 "$app" --mode Dashboard --screenshot "$PWD/appimage.png"
          test -s appimage.png || { echo "::error::AppImage did not render"; exit 1; }
          echo "::notice::AppImage $(du -h "$app" | cut -f1) starts and renders"
      - uses: actions/upload-artifact@v4
        with:
          name: Madhyam-linux
          path: |
            dist/*.deb
            dist/*.AppImage

  android:
    name: android (jniLibs + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build jniLibs into the app
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # API 21 = Android 5.0, the oldest Android TV release still in the wild.
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 21 -o android/app/src/main/jniLibs build --release -p madhyam-core-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: madhyam-core-android-jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Madhyam-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
