name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C ABI end-to-end test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) LIB=target/release/madhyam_core_ffi.dll ;;
            macOS)   LIB=target/release/libmadhyam_core_ffi.dylib ;;
            *)       LIB=target/release/libmadhyam_core_ffi.so ;;
          esac
          python bindings/python/e2e_test.py "$LIB"
      - name: Benchmark (informational)
        run: cargo run --release -p madhyam-core-cli -- bench 50000 30
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: madhyam-core-windows-x64
          path: |
            target/release/madhyam_core_ffi.dll
            target/release/madhyam_core_ffi.dll.lib
            target/release/iptv.exe
            include/madhyam_core.h

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release -p madhyam-core-ffi --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: madhyam-core-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/madhyam_core_ffi.dll

  android:
    name: android (jniLibs + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build jniLibs into the app
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # API 21 = Android 5.0, the oldest Android TV release still in the wild.
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 21 -o android/app/src/main/jniLibs build --release -p madhyam-core-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: madhyam-core-android-jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Madhyam-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
